# この repo 固有の firewall 許可先（init-firewall.sh が起動時に読む）。
# 書式: `dynamic <ドメイン>`。そのドメインとサブドメインを、コンテナ内のプロセスが名前解決した瞬間に
#       dnsmasq が回答 IP を ipset allowed-domains に入れる（init-firewall.sh の setup_dynamic_dns）。
#       アプリが引いた IP と firewall が許可した IP が常に一致するので、CDN の IP が回っても切れない。
#       ほかに 1 行 1 ドメイン（起動時に 1 回だけ解決した IP を許可）と `cidr-url <URL>` も読めるが、
#       起動時の IP 固定は CDN 配下で切れる（2026-10-15、再起動直後でも cdn.playwright.dev と
#       plausible.io に繋がらなかった）ので使わない。
#       `#` 以降はコメント。
# ※ 全コンテナ共通の許可先は母艦の ~/dotfiles/claude/devcontainer/allowed-domains-common.conf に書く。
#    raw.githubusercontent.com・zenn.dev・qiita.com・status.npmjs.org・www.githubstatus.com・
#    bridge.claudeusercontent.com はそちらにある（dotfiles 8ccd938、2026-10-15 に移した）。

# yarn 4（corepack の yarn 本体取得 + npm ミラー）
dynamic registry.yarnpkg.com
dynamic repo.yarnpkg.com

# Playwright ブラウザ再取得（バージョン更新時。初回は firewall 適用前の postCreate で取得）
dynamic cdn.playwright.dev
dynamic playwright.download.prss.microsoft.com

# CF preview（*.workers.dev の疎通確認用）。CF 全レンジ（cidr-url https://www.cloudflare.com/ips-v4）
# の許可は、CF 配下に移った example.com（2026-07-18 実測）まで通してしまい自己検証と両立しない
# ため撤回。使うホストだけ許可する。
# 注意: CF のエッジ IP は多数のサイトで共有されるため、これでも完全な出口制限にはならない
# ブランチ別 alias（<branch>-byte-lark.tanimoto-a49.workers.dev）は byte-lark.tanimoto-a49.workers.dev の
# サブドメインではないので、アカウントのサブドメイン tanimoto-a49.workers.dev ごと許可する
dynamic tanimoto-a49.workers.dev

# 本番ドメイン（scripts/health-check.sh の動作確認・公開後の実測用）
dynamic byte-lark.com

# ドキュメント参照
dynamic docs.astro.build
dynamic developers.cloudflare.com

# herdr 公式 docs（記事 T8 / PHASE1E-008 の裏取り用。spaces / tabs / agents の思想と通知の仕組み）
dynamic herdr.dev

# サイトが読み込む解析スクリプト（E2E 実行時のアクセス先）
dynamic plausible.io

# お問い合わせフォームの Cloudflare Turnstile（src/components/ContactForm.tsx の api.js と認証用 iframe）。
# 塞いだままだと /contact のスクショで「認証ウィジェットの読み込みに失敗しました」と出て、
# フォームの表示を運営者が母艦で見直すことになる
dynamic challenges.cloudflare.com

# カバー画像生成（tools/imagegen。PHASE1E-004 でコンテナ内実行に対応）
# pypi 2 つは pip の依存取得先、googleapis は Gemini API 本体
dynamic pypi.org
dynamic files.pythonhosted.org
dynamic generativelanguage.googleapis.com
